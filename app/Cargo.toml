[package]
name = "neuroarena-app"
description = "NeuroArena: the native macOS window, renderer and panels for the Arena."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "neuroarena_app"
path = "src/lib.rs"

[[bin]]
name = "neuroarena"
path = "src/main.rs"

[dev-dependencies]

[dependencies]
neuroarena-sim = { path = "../sim" }
winit = "0.30"
wgpu = "25"
cosmic-text = "0.19"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"

[lints.rust]
unsafe_code = "forbid"
