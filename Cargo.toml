[workspace]
members = ["sim", "app"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[profile.release]
lto = "thin"

# The Arena runs at full speed in release; a debug build of the simulation is
# only for tests. Dependencies stay optimised in debug so `cargo test` is usable.
[profile.dev.package."*"]
opt-level = 2
